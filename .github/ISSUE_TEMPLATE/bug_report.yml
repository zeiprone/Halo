name: Bug report
description: Report reproducible behavior that differs from expectations.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, private lyrics cache files, or other personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Spotify
        2. Open Halo
        3. …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.0"
    validations:
      required: true
  - type: input
    id: halo
    attributes:
      label: Halo version or commit
      placeholder: "e.g. 0.3.0 or abc1234"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact any personal information before attaching logs.
