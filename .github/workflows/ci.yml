name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release configuration
        run: swift build -c release --product Halo

      - name: Validate scripts
        run: bash -n script/build_and_run.sh script/package_release.sh

      - name: Validate app packaging
        run: ./script/package_release.sh
